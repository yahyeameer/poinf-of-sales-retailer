project_id = "ai-pos"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = true
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "5MiB"

# Product photos. Public-read so the mobile app can cache them cheaply on a
# flaky connection; writes are restricted to the owning tenant by policy.
[storage.buckets.product-images]
public = true
file_size_limit = "2MiB"
allowed_mime_types = ["image/jpeg", "image/png", "image/webp"]

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "aipos://"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# Owners onboard in one sitting on a bad connection; waiting on an email round
# trip loses them. Turn this on in production once delivery is set up.
enable_confirmations = false

# Without this hook there is no tenant_id claim in the JWT, every RLS policy
# denies every row, and the app looks empty rather than broken. See docs/deploy.md.
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"

[analytics]
enabled = false

[edge_runtime]
enabled = true
policy = "oneshot"
